<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم - شهداء لواء 43</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Tajawal', sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #1e3c72 100%);
            direction: rtl;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
        }
        
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                radial-gradient(circle at 20% 50%, rgba(255,255,255,0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255,255,255,0.05) 0%, transparent 50%),
                radial-gradient(circle at 40% 20%, rgba(255,255,255,0.08) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        #loading {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            color: white;
            font-size: 24px;
            font-weight: 600;
        }
        
        #loading.hidden {
            display: none;
        }
        
        @keyframes slideInUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }
        
        @keyframes glow {
            0%, 100% { box-shadow: 0 0 20px rgba(255,255,255,0.3); }
            50% { box-shadow: 0 0 40px rgba(255,255,255,0.6); }
        }
        
        .animate-slide-up {
            animation: slideInUp 0.6s ease-out;
        }
        
        .animate-fade-in {
            animation: fadeIn 0.8s ease-out;
        }
        
        .animate-glow {
            animation: glow 2s ease-in-out infinite;
        }
        
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.1);
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }
        
        .islamic-pattern {
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,255,255,.05) 35px, rgba(255,255,255,.05) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255,255,255,.03) 35px, rgba(255,255,255,.03) 70px);
        }
        
        .card-hover {
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .card-hover:hover {
            transform: translateY(-10px) scale(1.02);
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 12px 30px;
            border-radius: 25px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }
        
        .btn-danger {
            background: linear-gradient(135deg, #f56565 0%, #e53e3e 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-danger:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(245, 101, 101, 0.4);
        }
        
        .btn-success {
            background: linear-gradient(135deg, #48bb78 0%, #38a169 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .btn-success:hover {
            transform: translateY(-2px);
        }
        
        .form-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 15px;
            padding: 12px 20px;
            color: #2d3748;
            font-size: 16px;
            font-weight: 600;
            outline: none;
            transition: all 0.3s ease;
        }
        
        .form-input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        .form-textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.9);
            border: 2px solid rgba(102, 126, 234, 0.2);
            border-radius: 15px;
            padding: 12px 20px;
            color: #2d3748;
            font-size: 16px;
            resize: vertical;
            min-height: 100px;
        }
        
        .admin-table {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.2);
        }
        
        .admin-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            text-align: right;
            font-weight: 700;
        }
        
        .admin-table td {
            padding: 15px;
            border-bottom: 1px solid rgba(102, 126, 234, 0.1);
            color: #2d3748;
        }
        
        .admin-table tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        #root {
            position: relative;
            z-index: 1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 50px;
            animation: slideInUp 0.6s ease-out;
        }

        .header h1 {
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 18px;
            opacity: 0.9;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 30px;
            margin-bottom: 50px;
        }

        .admin-btn {
            position: fixed;
            bottom: 30px;
            left: 30px;
            z-index: 100;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div style="text-align: center;">
            <div style="font-size: 48px; margin-bottom: 20px; animation: glow 2s ease-in-out infinite;">⚔️</div>
            <div>جاري تحميل موقع شهداء لواء 43...</div>
        </div>
    </div>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const DB_KEY = "sabaldujail_martyrs";
        const ADMIN_PASS = "sab43admin";

        const storageAPI = {
            get: () => {
                try {
                    const data = localStorage.getItem(DB_KEY);
                    return data ? JSON.parse(data) : defaultMartyrs;
                } catch {
                    return defaultMartyrs;
                }
            },
            set: (data) => {
                try {
                    localStorage.setItem(DB_KEY, JSON.stringify(data));
                    return true;
                } catch {
                    return false;
                }
            }
        };

        const defaultMartyrs = [
            { id: 1, name: "الشهيد علي حسين الزيدي", province: "بغداد", unit: "لواء 43", date: "2014-10-12", bio: "بطل من أبطال لواء 43" },
            { id: 2, name: "الشهيد محمد جاسم العبيدي", province: "كربلاء", unit: "لواء 43", date: "2015-03-05", bio: "استشهد وهو يدافع عن أرض العراق" },
            { id: 3, name: "الشهيد حسن عباس النجار", province: "النجف الاشرف", unit: "لواء 43", date: "2015-06-20", bio: "فدى روحه الطاهرة" },
            { id: 4, name: "الشهيد قاسم ناصر المحمداوي", province: "البصرة", unit: "لواء 43", date: "2016-01-15", bio: "من فرسان الجنوب الأوفياء" },
        ];

        const MartyrCard = ({ martyr, onClick }) => {
            const [isHovered, setIsHovered] = useState(false);
            
            return (
                <div
                    onClick={() => onClick(martyr)}
                    onMouseEnter={() => setIsHovered(true)}
                    onMouseLeave={() => setIsHovered(false)}
                    className="animate-slide-up card-hover"
                    style={{
                        background: 'rgba(255, 255, 255, 0.95)',
                        borderRadius: '20px',
                        padding: '35px 25px',
                        cursor: 'pointer',
                        transition: 'all 0.4s ease',
                        position: 'relative',
                        overflow: 'hidden',
                        transform: isHovered ? 'translateY(-15px) scale(1.03)' : 'translateY(0) scale(1)',
                        boxShadow: isHovered 
                            ? '0 25px 50px rgba(0,0,0,0.3), 0 0 30px rgba(102, 126, 234, 0.4)'
                            : '0 15px 35px rgba(0,0,0,0.15)',
                    }}
                >
                    <div style={{
                        width: '110px',
                        height: '110px',
                        borderRadius: '50%',
                        margin: '0 auto 25px',
                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                        display: 'flex',
                        alignItems: 'center',
                        justifyContent: 'center',
                        color: 'white',
                        fontSize: '40px',
                    }}>
                        <i className="fas fa-user"></i>
                    </div>

                    <h3 style={{
                        background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                        WebkitBackgroundClip: 'text',
                        WebkitTextFillColor: 'transparent',
                        fontSize: '22px',
                        fontWeight: '800',
                        margin: '0 0 20px',
                        textAlign: 'center',
                    }}>{martyr.name}</h3>

                    <div style={{ display: 'flex', flexDirection: 'column', gap: '12px' }}>
                        <div style={{
                            background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                            color: 'white',
                            padding: '12px 20px',
                            borderRadius: '30px',
                            fontSize: '15px',
                            fontWeight: '700',
                            textAlign: 'center',
                        }}>
                            📍 {martyr.province}
                        </div>
                        
                        <div style={{
                            background: 'rgba(102, 126, 234, 0.15)',
                            color: '#667eea',
                            padding: '10px 18px',
                            borderRadius: '25px',
                            fontSize: '14px',
                            textAlign: 'center',
                            border: '2px solid rgba(102, 126, 234, 0.2)',
                        }}>
                            📅 {martyr.date}
                        </div>
                    </div>
                </div>
            );
        };

        const MartyrModal = ({ martyr, onClose }) => {
            if (!martyr) return null;
            
            return (
                <div onClick={onClose} style={{
                    position: 'fixed',
                    inset: 0,
                    zIndex: 2000,
                    background: 'rgba(0, 0, 0, 0.85)',
                    backdropFilter: 'blur(15px)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                    padding: '20px',
                }}>
                    <div onClick={e => e.stopPropagation()} style={{
                        background: 'rgba(255, 255, 255, 0.98)',
                        borderRadius: '30px',
                        padding: '50px',
                        maxWidth: '700px',
                        width: '100%',
                        direction: 'rtl',
                        boxShadow: '0 30px 60px rgba(0,0,0,0.4)',
                        maxHeight: '90vh',
                        overflowY: 'auto',
                        position: 'relative',
                    }}>
                        <button onClick={onClose} style={{
                            position: 'absolute',
                            top: '25px',
                            left: '25px',
                            background: 'linear-gradient(135deg, #f093fb 0%, #f5576c 100%)',
                            border: 'none',
                            color: 'white',
                            width: '45px',
                            height: '45px',
                            borderRadius: '50%',
                            cursor: 'pointer',
                            fontSize: '20px',
                        }}>
                            ✕
                        </button>

                        <div style={{ textAlign: 'center' }}>
                            <div style={{
                                width: '140px',
                                height: '140px',
                                borderRadius: '50%',
                                margin: '0 auto 30px',
                                background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                display: 'flex',
                                alignItems: 'center',
                                justifyContent: 'center',
                                color: 'white',
                                fontSize: '60px',
                            }}>
                                <i className="fas fa-user"></i>
                            </div>

                            <h2 style={{
                                background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                WebkitBackgroundClip: 'text',
                                WebkitTextFillColor: 'transparent',
                                fontSize: '32px',
                                fontWeight: '900',
                                margin: '0 0 25px',
                            }}>{martyr.name}</h2>

                            <div style={{ display: 'flex', flexDirection: 'column', gap: '18px', marginBottom: '30px' }}>
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '20px',
                                    padding: '20px',
                                    background: 'rgba(102, 126, 234, 0.1)',
                                    borderRadius: '20px',
                                }}>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ color: '#718096', fontSize: '14px', marginBottom: '5px' }}>المحافظة</div>
                                        <div style={{ color: '#2d3748', fontSize: '18px', fontWeight: '800' }}>{martyr.province}</div>
                                    </div>
                                </div>
                                
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '20px',
                                    padding: '20px',
                                    background: 'rgba(118, 75, 162, 0.1)',
                                    borderRadius: '20px',
                                }}>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ color: '#718096', fontSize: '14px', marginBottom: '5px' }}>الوحدة</div>
                                        <div style={{ color: '#2d3748', fontSize: '18px', fontWeight: '800' }}>{martyr.unit}</div>
                                    </div>
                                </div>
                                
                                <div style={{
                                    display: 'flex',
                                    alignItems: 'center',
                                    gap: '20px',
                                    padding: '20px',
                                    background: 'rgba(240, 147, 251, 0.1)',
                                    borderRadius: '20px',
                                }}>
                                    <div style={{ flex: 1 }}>
                                        <div style={{ color: '#718096', fontSize: '14px', marginBottom: '5px' }}>تاريخ الاستشهاد</div>
                                        <div style={{ color: '#2d3748', fontSize: '18px', fontWeight: '800' }}>{martyr.date}</div>
                                    </div>
                                </div>
                            </div>

                            <div style={{
                                background: 'linear-gradient(135deg, #667eea08 0%, #764ba208 100%)',
                                padding: '25px',
                                borderRadius: '20px',
                                border: '2px solid rgba(102, 126, 234, 0.2)',
                                textAlign: 'right',
                                marginBottom: '30px',
                            }}>
                                <h4 style={{
                                    background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                    WebkitBackgroundClip: 'text',
                                    WebkitTextFillColor: 'transparent',
                                    fontSize: '20px',
                                    fontWeight: '800',
                                    margin: '0 0 15px',
                                }}>السيرة الذاتية</h4>
                                <p style={{
                                    color: '#4a5568',
                                    fontSize: '17px',
                                    lineHeight: '2',
                                    margin: 0,
                                }}>{martyr.bio}</p>
                            </div>

                            <div style={{
                                background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                                borderRadius: '20px',
                                padding: '30px',
                                color: 'white',
                                textAlign: 'center',
                            }}>
                                <p style={{ fontSize: '18px', lineHeight: '2.2', margin: 0 }}>
                                    ﴿ وَلَا تَحْسَبَنَّ الَّذِينَ قُتِلُوا فِي سَبِيلِ اللَّهِ أَمْوَاتًا ۚ بَلْ أَحْيَاء ﴾
                                </p>
                                <p style={{ fontSize: '14px', marginTop: '12px', opacity: 0.9 }}>
                                    سورة آل عمران — الآية 169
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const AdminLogin = ({ onLogin, onClose }) => {
            const [pass, setPass] = useState("");
            const [err, setErr] = useState(false);
            
            const submit = () => {
                if (pass === ADMIN_PASS) { 
                    onLogin(); 
                    setErr(false); 
                } else {
                    setErr(true);
                }
            };
            
            return (
                <div onClick={onClose} style={{
                    position: 'fixed',
                    inset: 0,
                    zIndex: 3000,
                    background: 'rgba(0, 0, 0, 0.85)',
                    display: 'flex',
                    alignItems: 'center',
                    justifyContent: 'center',
                }}>
                    <div onClick={e => e.stopPropagation()} style={{
                        background: 'rgba(255, 255, 255, 0.98)',
                        borderRadius: '30px',
                        padding: '50px',
                        maxWidth: '450px',
                        width: '100%',
                        direction: 'rtl',
                        textAlign: 'center',
                        boxShadow: '0 30px 60px rgba(0,0,0,0.4)',
                        position: 'relative',
                    }}>
                        <div style={{ fontSize: '60px', marginBottom: '25px', color: '#667eea' }}>
                            <i className="fas fa-user-shield"></i>
                        </div>
                        <h2 style={{
                            background: 'linear-gradient(135deg, #667eea 0%, #764ba2 100%)',
                            WebkitBackgroundClip: 'text',
                            WebkitTextFillColor: 'transparent',
                            fontSize: '28px',
                            fontWeight: '900',
                            marginBottom: '15px',
                        }}>لوحة الإدارة</h2>
                        <p style={{
                            color: '#718096',
                            fontSize: '16px',
                            marginBottom: '35px',
                            fontWeight: '600',
                        }}>أدخل كلمة المرور للدخول</p>
                        
                        <input
                            type="password"
                            value={pass}
                            onChange={e => { setPass(e.target.value); setErr(false); }}
                            onKeyDown={e => e.key === "Enter" && submit()}
                            placeholder="كلمة المرور"
                            className="form-input"
                            style={{ marginBottom: '25px' }}
                        />
                        
                        {err && (
                            <p style={{
                                color: '#f56565',
                                fontSize: '15px',
                                marginBottom: '25px',
                                fontWeight: '600',
                                background: 'rgba(245, 101, 101, 0.1)',
                                padding: '12px',
                                borderRadius: '15px',
                            }}>
                                ⚠️ كلمة المرور غير صحيحة
                            </p>
                        )}
                        
                        <div style={{ display: 'flex', gap: '15px' }}>
                            <button onClick={submit} className="btn-primary" style={{ flex: 1, padding: '18px', fontSize: '17px' }}>
                                دخول
                            </button>
                            <button onClick={onClose} className="btn-secondary" style={{ flex: 1, padding: '18px', fontSize: '17px' }}>
                                إلغاء
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const App = () => {
            const [martyrs, setMartyrs] = useState(storageAPI.get());
            const [selectedMartyr, setSelectedMartyr] = useState(null);
            const [showAdminLogin, setShowAdminLogin] = useState(false);
            const [isAdmin, setIsAdmin] = useState(false);

            useEffect(() => {
                const loading = document.getElementById("loading");
                setTimeout(() => {
                    loading.classList.add("hidden");
                }, 1000);
            }, []);

            return (
                <>
                    <div className="container">
                        <div className="header">
                            <h1>🕌 شهداء لواء 43</h1>
                            <p>نتذكر أبطال الجنة الأوفياء</p>
                        </div>

                        <div className="grid">
                            {martyrs.map(martyr => (
                                <MartyrCard key={martyr.id} martyr={martyr} onClick={setSelectedMartyr} />
                            ))}
                        </div>
                    </div>

                    <div className="admin-btn">
                        <button 
                            onClick={() => setShowAdminLogin(true)}
                            className="btn-primary"
                            style={{ padding: '15px 30px', fontSize: '16px' }}
                        >
                            <i className="fas fa-lock"></i> إدارة
                        </button>
                    </div>

                    {selectedMartyr && (
                        <MartyrModal martyr={selectedMartyr} onClose={() => setSelectedMartyr(null)} />
                    )}

                    {showAdminLogin && !isAdmin && (
                        <AdminLogin 
                            onLogin={() => {
                                setIsAdmin(true);
                                setShowAdminLogin(false);
                                alert("مرحبا بك في لوحة الإدارة!\n\nيمكنك إضافة أو تعديل بيانات الشهداء");
                            }}
                            onClose={() => setShowAdminLogin(false)}
                        />
                    )}
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
